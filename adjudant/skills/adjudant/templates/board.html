  /* ── Tokens: ZenaSoft ──────────────────────────────────────────────────
     The Adjudant Classic skin. A 70s corporate-paper memo: warm cream stock,
     brown-black ink, a warm orange accent, and no rounded corner anywhere.
     Its references are IBM annual reports c.1973, Container Corp of America,
     Mobil corporate guidelines and Knoll spec sheets, so it is corporate
     modernism rather than anything nostalgic.

     Ported from the ZenaSoft DESIGN.md that governs the ops surfaces. Hue,
     chroma and the whole light neutral scale are that document's, unchanged.
     Four slots had to move, and each one is a fact about THIS surface rather
     than a disagreement with that one:

       --text-faint  58% -> 48% light. A form sets its faint slot at label
                     size; this board sets 11.5px counts, ids and field labels
                     in it, so the 4.5:1 body floor applies. 58% measured
                     2.99:1 on the well.
       dark scale    ZenaSoft's dark is a secondary opt-in and puts surface-2
                     ABOVE surface (32% over 28%), inverting its own light
                     order. A lane well has to stay recessive under a card in
                     both schemes, so this reads page 22 / well 24 / card 28.
       dark ink      Its dark text-dim and text-faint measured 3.93 and 2.12
                     against that scale. Lifted until both clear 4.5.
       dark accent   ZenaSoft locks the accent across themes, which is right
                     for a light-first identity. Here the accent is also the
                     focus ring, and 2.13:1 fails SC 1.4.11, so dark lifts it.

     --bg, --surface, --surface-2 and --text-faint MUST stay literal
     oklch(L% C H) triples, and the dark block must keep its closing shape
     (`    }` then `  }`). test_board reads this text to compute real contrast
     ratios; a color-mix() or a var() in those four makes it unreadable.

     --text-faint carries the lane counts, the empty-lane markers, the card
     ids and the sheet's field labels, all at 11.5px, so the 4.5:1 floor
     applies rather than the large-text one. Measured against bg / surface / surface-2:
     4.75, 5.05, 4.56 light and 6.13, 5.07, 5.66 dark. ── */
  /* The display face, carried IN the file ---------------------------------

     template renders. The board is offline-locked, so a face is either embedded
     or absent, and absent meant every heading fell through to Iowan Old Style:
     a wide, soft book serif where the brand is a tight condensed slab. Not the
     same voice, not close, and nobody could see it was wrong without knowing
     what right looked like.

     A data URI fetches nothing, which is exactly what validator 24 protects:
     it bans url() pointing off-machine, not url() itself. 12 KB of woff2 buys

  :root{
    color-scheme: light dark;
    --bg:oklch(91% 0.012 75);
    --surface:oklch(93% 0.012 75);
    --surface-2:oklch(88% 0.014 75);
    --text-faint:oklch(48% 0.015 65);
    --text:oklch(22% 0.012 60);
    --text-dim:oklch(40% 0.014 60);
    --border:oklch(78% 0.016 75);
    --border-strong:oklch(62% 0.020 75);
    --accent:oklch(52% 0.17 38);
    --accent-wash:oklch(90% 0.045 38);
    --ok:oklch(48% 0.14 145);
    --bad:oklch(48% 0.20 25);
    --park:oklch(48% 0.010 70);
    /* The ZenaSoft logo's own three bands. They are the wipe, and they are the
       plume on the mark, so they are the one palette shared with the figure.
       paintMark() overrides them when the other figure turns up: her band is
       drawn from colours that occur in HER asset and not in his. */
    --band-1:#7c1b16; --band-2:#bd281c; --band-3:#dd4d25;
    /* The memo has no shadow vocabulary. The one raised surface, the card
       sheet, is separated by a NeXT-style inset bevel instead (see .sheet). */
    --lift:none;

    --s1:4px; --s2:8px; --s3:12px; --s4:20px; --s5:32px; --s6:48px;
    /* Zero everywhere. Square wells, square cards, square chips: the sharp
       corner is the memo's voice, not a setting. */
    --r-well:0px; --r-card:0px; --r-chip:0px;
    --fs-micro:11.5px; --fs-small:12.5px; --fs-body:14px; --fs-lead:26px;
    --ease:cubic-bezier(0.22, 1, 0.36, 1);
    /* The first name is the embedded @font-face above, so it always wins. The
       rest are insurance for a data URI that somehow fails to decode. */
    --serif:"Mozilla Headline Condensed","Mozilla Headline",Georgia,"Times New Roman",serif;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:oklch(22% 0.014 70);
      --surface:oklch(28% 0.014 70);
      --surface-2:oklch(24% 0.014 70);
      --text-faint:oklch(68% 0.012 70);
      /* the mark's head, so it reads the way body text reads */
      --mark-ink:#e2ddd7;
      /* TWO detail inks, because there are two jobs, and 4.1.5 through 4.1.8 ran
         them off one token. Isolating each path and reading its bounding box off
         the alpha channel says what they actually are: his #24292c and her
         #262b2e are EARS, her #272b2e is the eye, and he has no eye path at all
         -- his is negative space in the silhouette.

         An ear is skin. It shades with the face and must not read as another
         material, which a grey ear on a cream cheek does. On light it is a cool
         near-black a step off the head's warm one, so on dark it is a cool cream
         a step off the head's warm one: the mirror, which is right HERE even
         though it was wrong for the eye. */
      --mark-shade:#d7dde2;
      /* An eye is not skin, and it is the one place the mirror fails. Hers is
         215px wide and 1.21% of the mark against his 50px ear at 0.54%; a
         whisper-level step leaves a feature that size as a pale patch merging
         into a pale cheek, which is a blank stare. So it is an iris: cool, and
         dark enough against the cream to hold an edge. Picked off a rendered
         ladder at 52px, the size the board actually uses, not at inspection
         size where every rung looks fine. */
      --mark-eye:#949ca7;
      --text:oklch(90% 0.010 75);
      --text-dim:oklch(78% 0.012 72);
      --border:oklch(38% 0.014 70);
      --border-strong:oklch(50% 0.016 70);
      --accent:oklch(68% 0.15 38);
      --accent-wash:oklch(30% 0.05 38);
      --ok:oklch(62% 0.14 145);
      --bad:oklch(65% 0.19 25);
      --park:oklch(68% 0.010 70);
      --lift:none;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  ::selection{background:var(--accent-wash);color:var(--text)}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:var(--fs-body);line-height:1.5;
    -webkit-font-smoothing:antialiased;
    /* Paper stock. Two offset dot grids, straight from the ZenaSoft body
       rule: pure CSS, so nothing is fetched. */
    background-image:
      radial-gradient(oklch(35% 0.02 60 / 0.025) 1px, transparent 1px),
      radial-gradient(oklch(35% 0.02 60 / 0.020) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
  }

  /* ── The mark ─────────────────────────────────────────────────────────────
     A letterhead, not a title: the mark says which tool made this page, the
     h1 below says which board it is. The band sweeping out from behind the
     figure and uncovering the wordmark is the ZenaSoft logo's own three bars,
     which are also the plume on the figure's helmet. One motion, on open.

     This is a deliberate exception to ZenaSoft's "no entrance animations".
     That rule governs page chrome; a brand mark introducing itself once is
     the thing the rule exists to leave room for. */
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{width:52px;height:auto;flex:none;position:relative;z-index:2;display:block}
  .brand-text{min-width:0}
  .brand-word{position:relative;height:28px;display:flex;align-items:center;overflow:hidden}
  /* THE ONE ENTRANCE ANIMATION, and it is a deliberate exception. This theme
     has no entrance vocabulary: nothing else on the board moves on arrival,
     because chrome that announces itself is chrome you have to wait for. The
     mark is not chrome. It is the one moment the board is allowed to be a
     brand, it happens once per load, and it is over in seven tenths of a
     second. Anything longer is a splash screen. */
  .brand-word svg{
    height:21px;width:auto;color:var(--text);display:block;
    /* Locked to the band, not merely timed near it. See brand-uncover. */
    clip-path:inset(0 100% 0 0);animation:brand-uncover .62s linear .06s forwards
  }
  .brand-band{
    position:absolute;inset:0;display:flex;flex-direction:column;
    /* Unfurled, not flown in. It used to be a finished three-colour block that
       slid in from off-canvas, which read as a card being dealt from somewhere
       outside the page. Clipped from the left edge instead, it grows out of the
       figure standing there, which is where the plume already is. */
    clip-path:inset(0 100% 0 0);
    animation:brand-unfurl .62s linear .06s forwards;
    pointer-events:none
  }
  .brand-band i{flex:1}
  .brand-band i:nth-child(1){background:var(--band-1)}
  .brand-band i:nth-child(2){background:var(--band-2)}
  .brand-band i:nth-child(3){background:var(--band-3)}
  /* THE TWO HALVES MUST BE ONE TIMELINE, and the first cut was not.
     The band swept on its own curve while the word faded up on another, so the
     word was already 90% drawn a fifth of a second in, sitting under an opaque
     bar that had not reached it yet. Nothing was revealing anything; two things
     were happening near each other.

     A wipe is one constraint: the width of word showing must EQUAL the width the
     band has vacated. The band occupies [left, 100%], so it has vacated [0,
     left] -- which means the word's right inset must be exactly 100% minus the
     band's left inset, at every instant. That is only true if both run the same
     duration, the same delay, the same keyframe split and the same per-segment
     easing. They do, below. Change one and you must change its pair.

     Two curves, because it is two gestures. Out of the plume it decelerates,
     the way something unfurling runs out of slack. Away to the right it moves
     off evenly, because that half is not the band leaving, it is the wordmark
     arriving, and the wordmark should not be flung at anyone. */
  @keyframes brand-unfurl{
    0%{clip-path:inset(0 100% 0 0);animation-timing-function:cubic-bezier(.16,.84,.44,1)}
    44%{clip-path:inset(0 0 0 0);animation-timing-function:cubic-bezier(.45,.05,.25,1)}
    100%{clip-path:inset(0 0 0 100%)}
  }
  @keyframes brand-uncover{
    0%{clip-path:inset(0 100% 0 0)}
    /* held: through the whole unfurl the word is behind the band anyway */
    44%{clip-path:inset(0 100% 0 0);animation-timing-function:cubic-bezier(.45,.05,.25,1)}
    100%{clip-path:inset(0 0 0 0)}
  }

  /* ── Masthead ── */
  header.masthead{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:var(--s5) var(--s6) var(--s4);
    border-bottom:1px solid var(--border);
  }
  .head-row{display:flex;align-items:flex-start;gap:var(--s5);flex-wrap:wrap}
  .ident{min-width:0}
  /* The board's own name, subordinate to the mark: this is a letterhead, so
     the tool is named first and the document second. ZenaSoft's section-sub
     role, 14.5px sans in --text-dim. */
  .title{
    margin:1px 0 0;font-family:var(--sans);font-size:14.5px;
    font-weight:400;letter-spacing:normal;line-height:1.35;color:var(--text-dim)
  }
  .sub{margin:2px 0 0;font-size:var(--fs-small);color:var(--text-dim)}
  .sub[hidden]{display:none}
  .controls{display:flex;align-items:center;gap:var(--s3);margin-left:auto;flex-wrap:wrap}
  .controls input#q{
    font:inherit;font-size:var(--fs-small);
    background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-radius:var(--r-chip);
    padding:5px 9px;width:170px;outline:none;
    transition:border-color .15s var(--ease)
  }
  .controls input#q::placeholder{color:var(--text-faint)}
  .controls input#q:hover{border-color:var(--border-strong)}
  .controls button{
    font:inherit;font-size:var(--fs-small);
    background:var(--surface);color:var(--text-dim);cursor:pointer;
    border:1px solid var(--border);border-radius:var(--r-chip);padding:5px 10px;
    transition:color .15s var(--ease),border-color .15s var(--ease)
  }
  .controls button:hover{color:var(--text);border-color:var(--border-strong)}
  /* The save state IS the control. It used to be a badge reading "local" next
     to a button reading "Connect file": two things saying one thing in two
     vocabularies. Now the button names the action while there is one to take,
     and names the state once there is not. */
  .conn{display:inline-flex;align-items:center;gap:7px}
  .conn::before{content:"";width:7px;height:7px;border:1.5px solid currentColor;flex:none}
  .conn.on,.conn.on:hover{color:var(--accent);border-color:var(--accent)}
  .conn.on::before{background:currentColor;border-color:currentColor}
  .conn.bad,.conn.bad:hover{color:var(--bad);border-color:var(--bad);font-weight:600}
  .conn.bad::before{background:currentColor;border-color:currentColor}
  /* an escape hatch, not a peer of the save control */
  .controls .link,.controls .link:hover{border-color:transparent;background:none}
  .controls .link{padding:5px 0;color:var(--text-faint);text-decoration:underline;text-underline-offset:3px}
  .controls .link:hover{color:var(--text)}

  /* counts as a sentence, not a slash-separated ledger strip */
  .meta{
    display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
    margin-top:var(--s4);font-size:var(--fs-small);color:var(--text-dim)
  }
  .meta b{font-weight:600;color:var(--text)}
  .meta .rule{width:1px;height:12px;background:var(--border-strong)}

  /* Two filters that narrow the board on two different axes. They were two
     rows of identically shaped buttons, which read as one undifferentiated
     block and left you to infer the axis from whether a key had a swatch or a
     count. Each row says which axis it is, once. */
  .rail-row{display:flex;align-items:baseline;gap:var(--s3);margin-top:var(--s3)}
  .rail-lbl{
    flex:none;width:2.4em;padding-top:2px;
    font-size:var(--fs-micro);color:var(--text-faint);
    text-transform:uppercase;letter-spacing:.07em
  }
  .legend{display:flex;gap:var(--s2);flex-wrap:wrap;min-width:0}
  /* a real <button>: keyboard-reachable, with aria-pressed carrying the toggle */
  .legend .k{
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    font:inherit;font-size:var(--fs-micro);color:var(--text-dim);
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-chip);padding:3px 9px 3px 7px;
    transition:color .15s var(--ease),border-color .15s var(--ease),opacity .15s var(--ease)
  }
  .legend .k i{width:8px;height:8px;background:var(--c)}
  /* A tag key has no hue to key, so it carries a count instead: the rail says
     how much of the deck each tag is worth before you spend a click on it. */
  .legend .k b{font-weight:500;color:var(--text-faint);font-variant-numeric:tabular-nums}
  .legend .k.on b{color:var(--text-dim)}
  .legend .rail-more{
    align-self:center;font-size:var(--fs-micro);color:var(--text-faint)
  }
  .legend .k:hover{color:var(--text);border-color:var(--border-strong)}
  .legend .k.off{opacity:.5}
  .legend .k.on{color:var(--text);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .legend .k:focus-visible,
  .controls button:focus-visible,
  .controls input#q:focus-visible,
  .notice button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .controls input#q:focus{border-color:var(--accent)}

  /* a save that did not happen, said out loud (see persist / applyMove) */
  .notice{
    display:flex;align-items:flex-start;gap:var(--s4);
    margin:var(--s4) var(--s6) 0;padding:var(--s3) var(--s4);
    background:var(--surface);color:var(--text);
    border:1px solid var(--border);border-left:3px solid var(--text-dim);
    border-radius:var(--r-card);font-size:var(--fs-small);line-height:1.55
  }
  .notice.bad{border-left-color:var(--bad)}
  .notice[hidden]{display:none}
  .notice button{
    font:inherit;font-size:var(--fs-micro);background:none;border:none;
    color:var(--text-dim);cursor:pointer;padding:0;margin-left:auto;
    text-decoration:underline;text-underline-offset:3px
  }
  .notice button:hover{color:var(--text)}
  .fatal{
    font-size:var(--fs-small);line-height:1.6;color:var(--text);
    border:1px solid var(--bad);border-radius:var(--r-card);
    padding:var(--s4);max-width:60ch
  }
  .fatal p{margin:var(--s2) 0 0}
  /* in the accessibility tree, out of the layout */
  .sr-only{
    position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0
  }

  /* ── Board: lanes are wells, cards sit in them ── */
  .board{
    display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);
    gap:var(--s3);align-items:stretch;overflow-x:auto;
    padding:var(--s5) var(--s6) var(--s6)
  }
  .lane{
    display:flex;flex-direction:column;min-width:0;
    background:var(--surface-2);border-radius:var(--r-well);padding:var(--s4);
    transition:background .18s var(--ease),box-shadow .18s var(--ease),opacity .18s var(--ease)
  }
  /* A terminal lane is told by its stamp and a quieter heading. It used to be
     told by a third grey mixed a shade off the other two, which read as a
     rendering artefact rather than as a state. */
  /* The colour is what carries this. The file embeds one cut of the display
     face, at 600, so the lighter weight below renders as 600 too and only
     matters if the embedded face ever fails and a fallback takes over. */
  .lane.muted .lane-head .nm{color:var(--text-dim);font-weight:500}
  .lane.unfiled{box-shadow:inset 0 0 0 1px var(--border-strong)}
  /* the one orchestrated moment: picking a card up lights every lane that can
     take it and quiets the rest. Motion answering an action, nothing on load. */
  .lane.drop{background:var(--accent-wash);box-shadow:inset 0 0 0 1.5px var(--accent)}
  body.dragging-now .lane:not(.drop){opacity:.6}

  .lane-head{display:flex;align-items:baseline;gap:var(--s2);padding:0 var(--s1) var(--s3)}
  .lane-head .nm{
    font-family:var(--serif);font-size:13.5px;font-weight:600;
    text-transform:uppercase;letter-spacing:.04em
  }
  /* Said once, in the heading. It used to be printed on every card in the lane,
     which restated the heading those cards were already sitting under, once per
     card, in a marker the accessibility tree was told to ignore. */
  .lane-head .stamp{
    font-family:var(--serif);font-size:var(--fs-micro);font-weight:600;
    letter-spacing:.06em;padding:1px 6px;border:1px solid currentColor
  }
  .lane-head .stamp.built{color:var(--ok)}
  .lane-head .stamp.parked{color:var(--park)}
  .lane-head .ct{margin-left:auto;font-size:var(--fs-small);color:var(--text-faint);font-variant-numeric:tabular-nums}
  .lane-head .ct.over{color:var(--bad);font-weight:600}
  .lane-body{
    display:flex;flex-direction:column;gap:var(--s2);flex:1 1 auto;
    min-height:72px;max-height:calc(100vh - 17rem);
    overflow-y:auto;overscroll-behavior:contain
  }
  /* a real target to aim at, not the old 48px strip — but sized to a card, not
     to the lane: a full-height dashed box makes an empty lane the loudest thing
     on the board. */
  .lane-empty{
    display:flex;align-items:center;justify-content:center;
    min-height:88px;padding:var(--s4);
    border:1px dashed var(--border-strong);border-radius:var(--r-card);
    font-size:var(--fs-micro);color:var(--text-faint);text-align:center
  }

  /* ── Card: the two lines you scan by, and the id you quote ── */
  .ticket{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
    transition:border-color .15s var(--ease),opacity .15s var(--ease)
  }
  .ticket:hover{border-color:var(--border-strong)}
  /* focus ring uses --text, never the category hue: the eight palette hues
     measure 1.65:1 to 2.28:1 on --surface, under the 3:1 SC 1.4.11 floor, so
     the documented keyboard alternative to dragging had no visible focus. */
  .ticket:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  /* The face is the button and the wrapper carries the drag, because one node
     cannot be both a listitem and a button. The ring is drawn on the wrapper so
     it surrounds the card rather than the button's padding box inside it. */
  .ticket:has(.ticket-face:focus-visible){outline:2px solid var(--text);outline-offset:2px}
  .ticket-face:focus-visible{outline:none}
  /* the source of a drag steps back; the target lane is what lights up */
  .ticket.dragging{opacity:.4;border-color:var(--border-strong)}
  .ticket-face{
    display:flex;flex-direction:column;gap:var(--s2);width:100%;
    font:inherit;color:inherit;text-align:left;background:none;border:0;
    padding:var(--s3);border-radius:inherit;cursor:grab
  }
  .ticket-face:active{cursor:grabbing}

  .t-title{font-size:var(--fs-body);line-height:1.42;color:var(--text);text-wrap:pretty}
  /* Two lines, then the sheet. An unclamped note made one card three times
     taller than its neighbours and pushed the rest of the lane out of view. */
  .t-note{
    font-size:var(--fs-small);line-height:1.45;color:var(--text-dim);
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden
  }
  .t-foot{display:flex;align-items:center;gap:7px;margin-top:var(--s1)}
  /* The same swatch the legend keys carry, so a card and its legend key read as
     one vocabulary. It classifies the card without printing the category name on
     every card in the deck. */
  .t-swatch{width:8px;height:8px;background:var(--c);flex:none}
  /* The exception names itself. The hue is mixed toward --text because the raw
     palette hue measures 1.65:1 to 2.28:1 as text on --surface. */
  .t-cat{font-size:var(--fs-micro);font-weight:600;color:color-mix(in oklch,var(--c) 52%,var(--text))}
  .t-id{font-family:var(--mono);font-size:var(--fs-micro);color:var(--text-faint);letter-spacing:.02em}
  /* The same chip the sheet draws, one step quieter, because on the face it is
     scanned past rather than read. Three, then a count: a tracker puts no
     ceiling on how many tags a card may carry, and the face must not grow with
     them. */
  .t-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:var(--s1)}
  .t-tags span{
    font-size:var(--fs-micro);color:var(--text-faint);
    border:1px solid var(--border);border-radius:var(--r-chip);padding:1px 6px;
    white-space:nowrap;max-width:16ch;overflow:hidden;text-overflow:ellipsis
  }
  .t-tags span.more{border-color:transparent;padding-left:1px}
  /* A tracker writes `priority` only when it is worth showing, so the key's
     presence is the signal. Quiet priorities must not shout in the same red as
     the urgent ones. */
  .prio{margin-left:auto;font-size:var(--fs-micro);font-weight:600;color:var(--bad)}
  .prio.quiet{color:var(--text-faint);font-weight:500}

  /* ── The card, opened ─────────────────────────────────────────────────────
     A native <dialog>. The focus trap, Esc, the inert background and the top
     layer all come from the platform, and the top layer is what puts the panel
     clear of the lane's own overflow-y:auto, which clips anything positioned
     inside it. Styled as a sheet against the right edge, not as a box dropped
     over the middle of the board. */
  .sheet{
    margin:0 0 0 auto;width:min(430px,100%);max-width:100%;
    height:100%;max-height:100%;
    padding:0;border:0;border-radius:0;
    background:var(--surface);color:var(--text)
  }
  /* The memo has no shadow vocabulary, so the sheet is separated the way the
     ZenaSoft shell separates its rail: a four-pixel NeXT inset channel, struck
     down the edge where the panel meets the board. */
  .sheet::before{
    content:"";position:absolute;inset:0 auto 0 0;width:4px;
    background:linear-gradient(90deg,
      var(--border-strong) 0 25%, var(--surface) 25% 50%,
      var(--border-strong) 50% 75%, var(--surface) 75% 100%)
  }
  .sheet::backdrop{background:oklch(24% 0.012 160 / 0.42)}
  .sheet-wrap{display:flex;flex-direction:column;height:100%}
  .sheet-head{
    display:flex;align-items:flex-start;gap:var(--s4);
    padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--border)
  }
  .sheet-title{
    margin:0;font-family:var(--serif);font-size:20px;font-weight:600;
    line-height:1.3;letter-spacing:normal;text-wrap:pretty
  }
  .sheet-close{
    flex:none;margin-left:auto;font:inherit;font-size:var(--fs-small);
    background:var(--surface);color:var(--text-dim);cursor:pointer;
    border:1px solid var(--border);border-radius:var(--r-chip);padding:4px 10px;
    transition:color .15s var(--ease),border-color .15s var(--ease)
  }
  .sheet-close:hover{color:var(--text);border-color:var(--border-strong)}
  /* The inline padding sits on the sections, not on the body, so a section's
     rule runs the full width of the sheet the way the head's rule does. Inset
     rules would have read as a second, weaker kind of line. */
  .sheet-body{flex:1 1 auto;overflow-y:auto;padding:var(--s5) 0}
  .sheet-sec{margin:0;padding:0 var(--s5)}
  /* A rule belongs to the section BELOW it, so the space is asymmetric: more
     above the line than below, and more above a label than under it. Whitespace
     alone was carrying every boundary in here, which left the sheet reading as
     one undifferentiated column of label, content, label, content. */
  .sheet-sec + .sheet-sec{
    margin-top:var(--s5);padding-top:var(--s4);
    border-top:1px solid var(--border)
  }
  .sheet-lbl{
    margin:0 0 var(--s2);font-family:var(--serif);font-size:var(--fs-micro);
    font-weight:600;text-transform:uppercase;letter-spacing:.06em;
    color:var(--text-faint)
  }
  .sheet-lbl-row{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s2)}
  .sheet-lbl-row .sheet-lbl{margin:0}
  /* One control shape for both the lane rail and the note toggle. They are the
     same idea, a set of states with one of them live, and drawing them two ways
     made one sheet speak two vocabularies. A track with the live segment lifted
     out of it, which also means the live state costs no accent: the surface
     change carries it, and the accent stays spent on the three things the token
     block names. It scrolls rather than wraps, because a segmented control
     folded onto a second row reads as broken, and a vault board has seven
     lanes to fit. */
  .rail{
    display:flex;gap:2px;padding:3px;
    background:var(--surface-2);
    overflow-x:auto;overscroll-behavior-x:contain
  }
  .rail button{
    flex:0 0 auto;white-space:nowrap;
    font:inherit;font-size:var(--fs-micro);cursor:pointer;
    background:none;color:var(--text-dim);border:0;
    padding:5px 10px;
    transition:background .15s var(--ease),color .15s var(--ease)
  }
  .rail button:hover{color:var(--text)}
  .rail button[aria-current="true"],.rail button[aria-pressed="true"]{
    background:var(--surface);color:var(--text);font-weight:600;
    box-shadow:inset 0 -2px 0 var(--accent)
  }
  /* drawn inside the track, so its own overflow cannot clip the ring */
  .rail button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
  .sheet-lbl-row .rail{margin-left:auto}

  /* The note, read rather than shown as source. Raw keeps every character the
     tracker wrote, which is the point of having the toggle at all. */
  .sheet-note{margin:0;font-size:var(--fs-small);line-height:1.6}
  .sheet-note.raw{
    white-space:pre-wrap;font-family:var(--mono);
    font-size:var(--fs-micro);color:var(--text-dim)
  }
  .sheet-note>*:first-child{margin-top:0}
  .sheet-note>*:last-child{margin-bottom:0}
  .sheet-note p{margin:0 0 var(--s3)}
  /* a body's own `#` is not this page's h1: the sheet title already holds that
     level, so a body heading starts two steps down */
  .sheet-note h3,.sheet-note h4{
    margin:var(--s4) 0 var(--s2);font-size:var(--fs-body);
    font-weight:600;letter-spacing:-0.008em
  }
  .sheet-note h5,.sheet-note h6{
    margin:var(--s4) 0 var(--s2);font-size:var(--fs-small);
    font-weight:600;color:var(--text-dim)
  }
  .sheet-note ul,.sheet-note ol{margin:0 0 var(--s3);padding-left:1.35em}
  .sheet-note li{margin:0 0 3px}
  /* A checklist is a status column, so it loses the bullet and hangs its boxes
     on one edge. `--ok` is already this board's done: the BUILT stamp wears it. */
  .sheet-note ul.tasks{list-style:none;padding-left:0}
  .sheet-note li.task{display:flex;gap:8px;align-items:baseline;margin:0 0 5px}
  .sheet-note li.task .box{
    flex:none;width:12px;height:12px;line-height:11px;text-align:center;
    font-size:10px;border:1px solid var(--border-strong);color:var(--ok);
    position:relative;top:1px
  }
  .sheet-note li.task.done .box{border-color:var(--ok)}
  /* Done steps back rather than striking through: a finished item is still read,
     and struck text is measurably slower to read when you need to. */
  .sheet-note li.task.done .txt{color:var(--text-faint)}
  .sheet-note blockquote{
    margin:0 0 var(--s3);padding-left:var(--s3);
    border-left:1px solid var(--border-strong);color:var(--text-dim)
  }
  .sheet-note code{
    font-family:var(--mono);font-size:var(--fs-micro);
    background:var(--surface-2);border-radius:var(--r-chip);padding:1px 4px
  }
  .sheet-note pre{
    margin:0 0 var(--s3);padding:var(--s3);overflow-x:auto;
    background:var(--surface-2);border-radius:var(--r-chip)
  }
  .sheet-note pre code{background:none;padding:0}
  .sheet-note hr{border:0;border-top:1px solid var(--border);margin:var(--s4) 0}
  .sheet-note a{color:var(--accent)}
  .sheet-facts{
    margin:0;display:grid;grid-template-columns:auto 1fr;
    gap:var(--s2) var(--s4);font-size:var(--fs-small);align-items:baseline
  }
  .sheet-facts dt{color:var(--text-faint);font-size:var(--fs-micro)}
  .sheet-facts dd{margin:0;color:var(--text)}
  .sheet-facts dd.mono{font-family:var(--mono);font-size:var(--fs-micro);letter-spacing:.02em}
  .sheet-cat{display:inline-flex;align-items:center;gap:7px}
  .sheet-cat i{width:8px;height:8px;background:var(--c);flex:none}
  .sheet-tags{display:flex;flex-wrap:wrap;gap:var(--s2)}
  .sheet-tags span{
    font-size:var(--fs-micro);color:var(--text-dim);
    border:1px solid var(--border);border-radius:var(--r-chip);padding:2px 8px
  }
  /* the relation rows stack inside one section, so they space themselves */
  #sheetLinks .sheet-lbl{margin-top:var(--s4)}
  #sheetLinks .sheet-lbl:first-child{margin-top:0}
  .sheet-refs{
    display:flex;flex-wrap:wrap;gap:var(--s2);
    font-family:var(--mono);font-size:var(--fs-micro);color:var(--text-dim);letter-spacing:.02em
  }
  .sheet [hidden]{display:none}
  .sheet-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Attribution, on the boards beans actually powers. */
  .colophon{padding:0 var(--s5) var(--s5);font-size:var(--fs-micro);color:var(--text-faint)}
  .colophon[hidden]{display:none}
  .colophon a{color:var(--text-dim);text-decoration:underline;text-underline-offset:3px}
  .colophon a:hover{color:var(--text)}
  .colophon a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  @media (max-width: 640px){
    header.masthead{padding:var(--s4) var(--s4) var(--s3)}
    .controls{width:100%;margin-left:0;margin-top:var(--s3)}
    .controls input#q{flex:1 1 100%;width:auto}
    .notice{margin:var(--s3) var(--s4) 0}
    .board{padding:var(--s4);grid-auto-columns:minmax(84vw,1fr);align-items:start}
    /* One lane is in view at a time here, so matching every well to the tallest
       turns an empty lane into a screen-high grey rectangle. Let each well end
       where its cards do, and let the page scroll instead of the lane. */
    .lane-body{flex:0 1 auto;max-height:none}
    /* a 430px rail on a 375px screen is a rail with no room to read in */
    .sheet{width:100%}
    .sheet-head{padding-left:var(--s4);padding-right:var(--s4)}
    .sheet-sec{padding-left:var(--s4);padding-right:var(--s4)}
    .colophon{padding-left:var(--s4);padding-right:var(--s4)}
  }
  @media (prefers-reduced-motion: reduce){
    .ticket,.lane,.legend .k,.controls button,.controls input#q,
    .rail button,.sheet-close{transition:none}
    .brand-word svg{animation:none;clip-path:none}
    .brand-band{display:none}
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="head-row">
    <div class="ident">
      <div class="brand">
        <svg class="brand-mark" id="brandMark" aria-hidden="true"></svg>
        <div class="brand-text">
          <span class="brand-word">
            <svg id="brandWord" viewBox="0 -75 300 85" role="img" aria-label="Adjudant"><path fill="currentColor"/></svg>
            <span class="brand-band" aria-hidden="true"><i></i><i></i><i></i></span>
          </span>
          <h1 class="title" id="boardTitle">Board</h1>
        </div>
      </div>
      <p class="sub" id="boardSub" hidden></p>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="Filter cards" spellcheck="false" autocomplete="off" aria-label="Filter cards">
      <button class="conn" id="connectBtn" type="button">Connect file</button>
      <button class="link" id="downloadBtn" type="button">Download</button>
    </div>
  </div>
  <div class="meta">
    <span><b id="cardCount">—</b> cards</span>
    <span class="rule" aria-hidden="true"></span>
    <span>updated <b id="rev">—</b></span>
  </div>
  <div class="rail-row"><span class="rail-lbl">Type</span><div class="legend" id="legend"></div></div>
  <div class="rail-row" id="tagRow" hidden><span class="rail-lbl">Tag</span><div class="legend tags" id="tagRail"></div></div>
</header>
<div class="notice" id="notice" role="alert" hidden>
  <span id="noticeText"></span>
